plugins {
    id 'java-library'
    id 'maven-publish'
    id 'idea'
    id 'net.neoforged.moddev' version '2.0.147'
}

version = mod_version
group = mod_group_id

repositories {
    // Offline / pre-seeded Maven repo (NeoForge userdev, neoform-runtime, build tools).
    // Declared first so cached artifacts resolve locally before hitting the network.
    exclusiveContent {
        forRepository {
            maven {
                name = "Local Maven"
                url = uri("${rootDir}/local-maven")
            }
        }
        // These exact artifacts are already supplied with the workspace. Avoid a
        // cached remote repository taking precedence over their local copies.
        filter {
            includeModule('net.neoforged', 'neoforge')
            includeModule('net.neoforged', 'neoform')
            includeModule('net.neoforged', 'neoform-runtime')
            includeModule('net.neoforged.installertools', 'installertools')
            includeModule('net.neoforged.jst', 'jst-cli-bundle')
            includeVersion('net.neoforged', 'AutoRenamingTool', '2.0.17')
            includeModule('net.minecraftforge', 'mergetool')
            includeGroup('net.neoforged.fancymodloader')
        }
    }
    maven {
        url = uri("https://maven.aliyun.com/repository/public/")
        content {
            includeGroup 'org.apache.commons'
        }
    }
    maven {
        // location of the maven that hosts JEI files since January 2023
        // Patchouli
        name = "Jared's maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name "KosmX's maven"
        url 'https://maven.kosmx.dev/'
    }
    maven {
        name = 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
        content {
            includeGroup("software.bernie.geckolib")
        }
    }
    maven {
        // location of a maven mirror for JEI files, as a fallback
        name = "Mod Maven"
        url = "https://modmaven.k-4u.nl"
    }
    exclusiveContent {
        forRepository {
            maven {
                url "https://cursemaven.com"
            }
        }
        filter {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "Illusive Soulworks maven"
        url = "https://maven.theillusivec4.top/"
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        // forRepositories(fg.repository) // Uncomment when using ForgeGradle
        filter {
            includeGroup "maven.modrinth"
        }
    }
    flatDir {
        dir 'libs'
    }
    mavenLocal()
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers.add('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        client2 {
            client()

            gameDirectory = project.file('run-client2')

            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id

            programArgument '--username=Ankrya'
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // mostly optional in a single mod project
        // but multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }


dependencies {
    implementation "dev.kosmx.player-anim:player-animation-lib-forge:${player_animation_lib}"
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
//    runtimeOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}"
//    compileOnly "top.theillusivec4.curios:curios-neoforge:${curios_version}:api"
    implementation "software.bernie.geckolib:geckolib-neoforge-${geckolib_version}"
//    implementation "curse.maven:photon-${photon_version}"
//    implementation "curse.maven:ldlib-${ldlib_version}"
//    implementation(implementation("maven.modrinth:t5W7Jfwy:nKHizsl6"))
//    jarJar(implementation("net.ankrya:rider_api:${rider_api_version}")) {
//        version {
//            prefer "${rider_api_version}"
//            require "[${rider_api_version},)"
//        }
//    }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [minecraft_version      : minecraft_version,
                             minecraft_version_range: minecraft_version_range,
                             neo_version            : neo_version,
                             neo_version_range      : neo_version_range,
                             loader_version_range   : loader_version_range,
                             mod_id                 : mod_id,
                             mod_name               : mod_name,
                             mod_license            : mod_license,
                             mod_version            : mod_version,
                             mod_authors            : mod_authors,
                             mod_description        : mod_description]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

// Reproducible generated icons and an explicit-palette emissive mask; originals stay untouched.
sourceSets {
    assetTools { java.srcDir 'tools/java' }
    safetyTest { java.srcDirs = ['src/test/server', 'src/test/math'] }
}
sourceSets.safetyTest.compileClasspath += sourceSets.main.output
sourceSets.safetyTest.runtimeClasspath += sourceSets.main.output

def generatedRiderAssets = layout.buildDirectory.dir('generated/riderAssets')
def generateRiderAssets = tasks.register('generateRiderAssets', JavaExec) {
    dependsOn tasks.named('assetToolsClasses')
    classpath = sourceSets.assetTools.runtimeClasspath
    mainClass = 'RiderAssets'
    args file('src/main/resources').absolutePath, generatedRiderAssets.get().asFile.absolutePath
    inputs.file('src/main/resources/assets/zillion/textures/item/armor/gazerzero.png')
    inputs.dir('tools/java')
    outputs.dir(generatedRiderAssets)
}
sourceSets.main.resources.srcDir(generatedRiderAssets)
tasks.named('processResources') { dependsOn generateRiderAssets }

tasks.register('inspectArmorPalette', JavaExec) {
    dependsOn tasks.named('assetToolsClasses')
    classpath = sourceSets.assetTools.runtimeClasspath
    mainClass = 'RiderAssets'
    args file('src/main/resources').absolutePath
}
tasks.register('transformationSafetyTest', JavaExec) {
    dependsOn tasks.named('safetyTestClasses')
    classpath = sourceSets.safetyTest.runtimeClasspath
    mainClass = 'TransformationSafetyTest'
}
tasks.register('choreographyTest', JavaExec) {
    dependsOn tasks.named('safetyTestClasses')
    classpath = sourceSets.safetyTest.runtimeClasspath
    mainClass = 'ChoreographyTest'
}
tasks.named('check') { dependsOn 'transformationSafetyTest', 'choreographyTest' }

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
